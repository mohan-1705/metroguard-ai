version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: metroguard-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: metroguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: metroguard-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/metroguard
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: metroguard-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
